<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tivoria logo">
  <defs>
    <linearGradient id="tivoriaBg" x1="8" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="55%" stop-color="#0066E6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="tivoriaGlow" cx="24%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tivoriaDot" x1="40" y1="38" x2="50" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4CD964"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <!-- Apple squircle base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tivoriaBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tivoriaGlow)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- Sculpted geometric T monogram -->
  <rect x="15" y="16.5" width="34" height="7.5" rx="3.75" fill="#FFFFFF"/>
  <rect x="28.25" y="22.5" width="7.5" height="25.5" rx="3.75" fill="#FFFFFF"/>
  <!-- Live confirmation emerald dot -->
  <circle cx="45.5" cy="42.5" r="7.5" fill="#30D158" fill-opacity="0.22"/>
  <circle cx="45.5" cy="42.5" r="5" fill="url(#tivoriaDot)"/>
</svg>
